[package]
name = "chlorum-wallpaper"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.16"

[profile.release]
lto = "thin"
strip = true
