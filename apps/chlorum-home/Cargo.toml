[package]
name = "chlorum-home"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Chlorum Home: clock, time zone and app ribbon on the Super key"

[dependencies]
tokio = { version = "1", features = ["process"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "f0f68933f1552857e2165fc0fa953228107bddef"
default-features = false
features = ["winit", "wayland", "tokio", "single-instance", "wgpu"]

[profile.release]
lto = "thin"
