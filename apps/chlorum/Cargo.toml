[package]
name = "chlorum"
version = "0.12.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Chlorum shell: Home, system menu, app layouts, login screen and Library"

[dependencies]
tokio = { version = "1", features = ["process", "net", "io-util", "time", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
niri-ipc = "=26.4.0"
serde_json = "1"
# live wallpaper: GLSL on the background layer
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.16"
# notifications from apps
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "f0f68933f1552857e2165fc0fa953228107bddef"
default-features = false
features = ["winit", "wayland", "tokio", "wgpu", "multi-window"]

# Same iced as libcosmic, with the canvas widget switched on.
[dependencies.iced]
git = "https://github.com/pop-os/libcosmic.git"
rev = "f0f68933f1552857e2165fc0fa953228107bddef"
default-features = false
features = ["canvas"]

[profile.release]
lto = "thin"
